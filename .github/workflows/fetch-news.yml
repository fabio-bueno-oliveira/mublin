name: Fetch Music News

on:
  schedule:
    - cron: '0 */6 * * *' # a cada 6 horas
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Call fetch-news endpoint
        run: |
          echo "Chamando /api/cron/fetch-news..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET https://mublin.vercel.app/api/cron/fetch-news \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1)
          
          echo "Status: $STATUS"
          echo "Body: $BODY"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "Erro no cron!"
            exit 1
          fi
