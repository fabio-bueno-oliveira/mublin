    <meta
      name="description"

    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mublin" />

      property="og:description"

    <meta property="og:url" content="https://mublin.com/" />
    <meta property="og:locale" content="pt_BR" />

    <meta property="og:image" content="https://mublin.com/og-square.png" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="Mublin - A rede profissional para músicos" />

    <meta property="og:image" content="https://mublin.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mublin" />
    <meta
      name="twitter:description"
      content="A rede profissional para músicos, produtores, roadies e todos que fazem a música acontecer."
